<!doctype html><html lang="ko"><head><meta charset="utf-8">
<style>
@font-face{font-family:'BHS';src:url(bhs.ttf) format('truetype');}
@font-face{font-family:'NotoK';src:url(noto900.ttf) format('truetype');font-weight:900;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1200px;height:1200px;overflow:hidden;}
.card{
  position:relative;width:1200px;height:1200px;overflow:hidden;
  background:
    radial-gradient(circle at 16% 6%, rgba(255,46,166,.60), transparent 46%),
    radial-gradient(circle at 90% 98%, rgba(124,77,255,.62), transparent 52%),
    linear-gradient(150deg,#1c0c2b 0%,#0b0410 100%);
  font-family:'NotoK',sans-serif;color:#f7f3ff;
}
.frame{position:absolute;inset:34px;border:3px solid rgba(255,209,102,.55);border-radius:40px;}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:92px 60px 150px;}
.eyebrow{font-family:'NotoK';font-size:32px;font-weight:900;letter-spacing:8px;color:#ffd166;text-align:center;}
.title{font-family:'BHS';font-size:142px;line-height:1.0;text-align:center;margin-top:16px;
  color:#ff53b4;text-shadow:0 0 32px rgba(255,46,166,.75),0 6px 0 rgba(0,0,0,.25);}
.sub{font-family:'NotoK';font-weight:900;font-size:40px;color:#ece0ff;margin-top:10px;letter-spacing:3px;}
.nickrow{display:flex;align-items:center;gap:26px;margin-top:40px;}
.nicklabel{font-family:'NotoK';font-weight:900;font-size:40px;color:#c4b4dd;}
.nick{font-family:'BHS';font-size:120px;line-height:1;color:#0b0410;
  background:linear-gradient(180deg,#ffe38f,#ffc22e);padding:6px 58px 22px;border-radius:32px;
  box-shadow:0 16px 48px rgba(255,201,60,.55);}
.phonecard{margin-top:44px;width:100%;background:rgba(9,3,14,.66);border:4px solid rgba(255,46,166,.75);
  border-radius:40px;padding:34px 20px 42px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.5);}
.phonelabel{font-family:'NotoK';font-weight:900;font-size:44px;color:#ffd166;letter-spacing:5px;}
.phone{font-family:'BHS';font-size:132px;line-height:1;color:#ffffff;letter-spacing:1px;margin-top:14px;white-space:nowrap;
  text-shadow:0 5px 0 #ff2ea6,0 12px 38px rgba(255,46,166,.8);}
.foot{position:absolute;left:0;right:0;bottom:86px;text-align:center;font-family:'NotoK';font-weight:900;
  font-size:34px;color:#d3c2ee;letter-spacing:1px;white-space:nowrap;}
.foot b{color:#ffd166;}
</style></head>
<body>
  <div class="card">
    <div class="frame"></div>
    <div class="wrap">
      <div class="eyebrow">상남동 · 모아엔트몰 지하 3층</div>
      <div class="title">창원 룰루랄라</div>
      <div class="sub">나이트클럽 예약문의</div>
      <div class="nickrow">
        <span class="nicklabel">닉네임</span>
        <span class="nick">로또</span>
      </div>
      <div class="phonecard">
        <div class="phonelabel">전화예약 · 부킹 · 룸</div>
        <div class="phone">010 7528 4936</div>
      </div>
    </div>
    <div class="foot">만 <b>27세 이상</b> 입장 · 연중무휴 19:00~05:00</div>
  </div>
</body></html>
